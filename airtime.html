<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buy Airtime • NefroPay</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"/>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@500;700&display=swap');
    
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
    
    /* Ultra-smooth background animation */
    body{
      min-height:100vh;
      background:linear-gradient(135deg,#921199b5,#3866efce,#ffb300);
      background-size:600% 600%;
      animation:gradient 20s ease infinite;
      color:white;
      display:flex;justify-content:center;align-items:center;
      padding:20px;
      overflow:hidden;
    }
    @keyframes gradient{
      0%{background-position:0% 50%}
      50%{background-position:100% 50%}
      100%{background-position:0% 50%}
    }

    .card{
      background:rgba(255,255,255,0.15);
      backdrop-filter:blur(32px);
      -webkit-backdrop-filter:blur(32px);
      border-radius:42px;
      width:100%;max-width:460px;
      padding:55px 38px;
      text-align:center;
      box-shadow:0 50px 120px rgba(0,0,0,0.5);
      border:3px solid rgba(56,239,125,0.7);
      position:relative;overflow:hidden;
      transform:translateY(0);
      animation:cardFloat 8s ease-in-out infinite;
    }
    @keyframes cardFloat{
      0%,100%{transform:translateY(0)}
      50%{transform:translateY(-15px)}
    }

    /* Floating orb glow */
    .card::before{
      content:'';position:absolute;top:-80%;left:-80%;
      width:300%;height:300%;
      background:radial-gradient(circle at 30% 30%,rgba(56,239,125,0.4),transparent 60%);
      animation:orb 25s linear infinite;
      pointer-events:none;
    }
    @keyframes orb{0%{transform:rotate(0deg) translateX(100px) rotate(0deg)}100%{transform:rotate(360deg) translateX(100px) rotate(-360deg)}}

    .icon{
      font-size:85px;color:#38ef7d;margin-bottom:28px;
      filter:drop-shadow(0 0 30px #38ef7d);
      animation:iconPulse 3s ease-in-out infinite;
    }
    @keyframes iconPulse{
      0%,100%{transform:scale(1);filter:drop-shadow(0 0 30px #38ef7d)}
      50%{transform:scale(1.15);filter:drop-shadow(0 0 60px #38ef7d)}
    }

    h1{
      font-size:42px;
      background:linear-gradient(90deg,#38ef7d,#00ff9d,#11998e);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      margin:18px 0;
      font-weight:700;
      animation:textGlow 4s ease infinite;
    }
    @keyframes textGlow{0%,100%{text-shadow:0 0 20px rgba(56,239,125,0.8)}50%{text-shadow:0 0 40px rgba(56,239,125,1)}}

    input,select{
      width:100%;padding:26px;margin:20px 0;
      background:rgba(255,255,255,0.22);border:none;
      border-radius:26px;color:white;font-size:20px;
      text-align:center;transition:all 0.4s cubic-bezier(0.25,0.8,0.25,1);
      backdrop-filter:blur(12px);
    }
    input:focus,select:focus{
      outline:none;
      background:rgba(255,255,255,0.35);
      transform:scale(1.03);
      box-shadow:0 0 30px rgba(56,239,125,0.6);
    }
    input::placeholder{color:#ccffdd;}

    .btn{
      width:100%;padding:26px;
      background:linear-gradient(45deg,#38ef7d,#00ff9d,#11998e);
      color:#000;font-weight:bold;border:none;
      border-radius:26px;font-size:23px;cursor:pointer;
      margin-top:25px;
      box-shadow:0 20px 60px rgba(56,239,125,0.6);
      transition:all 0.4s cubic-bezier(0.25,0.8,0.25,1);
      transform:translateY(0);
    }
    .btn:hover{
      transform:translateY(-14px) scale(1.03);
      box-shadow:0 35px 90px rgba(56,239,125,0.8);
    }
    .btn:active{transform:translateY(-8px) scale(1.01);}

    /* RECEIPT – Super Smooth */
    #receipt{
      position:fixed;top:0;left:0;width:100%;height:100%;
      background:rgba(0,0,0,0.97);display:none;justify-content:center;align-items:center;
      z-index:9999;padding:20px;backdrop-filter:blur(20px);
    }
    .receipt-card{
      background:linear-gradient(135deg,#11998e,#38ef7d);
      border-radius:40px;width:100%;max-width:440px;
      padding:55px 40px;text-align:center;
      border:5px solid #ffffff;
      box-shadow:0 0 150px rgba(56,239,125,0.9);
      transform:scale(0);
      animation:popSmooth 0.8s cubic-bezier(0.25,0.8,0.25,1) forwards;
    }
    @keyframes popSmooth{
      0%{transform:scale(0) rotate(-10deg);opacity:0}
      70%{transform:scale(1.1)}
      100%{transform:scale(1);opacity:1}
    }
    .success{
      font-size:120px;color:#ffffff;margin-bottom:30px;
      animation:heartBeat 2s ease-in-out infinite;
    }
    @keyframes heartBeat{
      0%,100%{transform:scale(1)}
      14%{transform:scale(1.3)}
      28%{transform:scale(1)}
      42%{transform:scale(1.3)}
      70%{transform:scale(1)}
    }
    .details{
      background:rgba(255,255,255,0.2);padding:35px;border-radius:26px;
      margin:35px 0;font-size:21px;line-height:2.6;
      backdrop-filter:blur(10px);
    }
    .auto-btn{
      background:#ffffff;color:#11998e;font-weight:bold;
      animation:glowPulse 2.5s ease infinite;
    }
    @keyframes glowPulse{
      0%,100%{box-shadow:0 0 30px #fff}
      50%{box-shadow:0 0 80px #fff,0 0 120px #38ef7d}
    }
  </style>
</head>
<body>

<div class="card">
  <div class="icon"><i class="fas fa-mobile-alt"></i></div>
  <h1>Buy Airtime</h1>
  <p>አየር ታይም ግዛ • Instant</p>

  <input type="tel" id="phone" placeholder="09xxxxxxxx" maxlength="10">
  <input type="number" id="amount" placeholder="Amount (ETB)" min="5">

  <select>
    <option>Ethio Telecom</option>
  </select>

  <button class="btn" onclick="buyAirtime()">Buy Now</button>
</div>

<div id="receipt">
  <div class="receipt-card">
    <div class="success"><i class="fas fa-check-circle"></i></div>
    <h1>Airtime Purchased!</h1>
    <p>አየር ታይም ተገዛ!</p>

    <div class="details" id="details"></div>

    <button class="btn auto-btn" id="autoBtn">
      Going to History in <span id="countdown">3</span>s...
    </button>
  </div>
</div>

<script>
  let user = JSON.parse(localStorage.getItem("nefro_user") || "{}");
  if (!user.balance) {
    user = { phone: "0912345678", balance: 70000, history: [] };
    localStorage.setItem("nefro_user", JSON.stringify(user));
  }
  document.getElementById("phone").value = user.phone || "";

  function buyAirtime() {
    const phone = document.getElementById("phone").value.trim();
    const amount = parseFloat(document.getElementById("amount").value);

    if (!phone || phone.length !== 10 || !phone.startsWith("09")) return alert("Invalid phone");
    if (!amount || amount < 5 || amount > user.balance) return alert("Minimum 5 ETB or low balance!");

    const tx = {
      type: "Airtime Purchase",
      phone: phone,
      amount: -amount,
      date: new Date().toLocaleString("en-ET"),
      ref: "AIRT" + Date.now().toString().slice(-8)
    };

    user.balance -= amount;
    user.history.unshift(tx);
    localStorage.setItem("nefro_user", JSON.stringify(user));

    document.getElementById("details").innerHTML = `
      <strong>Ref:</strong> ${tx.ref}<br>
      <strong>Phone:</strong> ${phone}<br>
      <strong>Amount:</strong> ${amount.toFixed(2)} ETB<br>
      <strong>Balance:</strong> ${user.balance.toFixed(2)} ETB
    `;
    document.getElementById("receipt").style.display = "flex";

    let s = 3;
    const el = document.getElementById("countdown");
    const timer = setInterval(() => {
      s--;
      el.textContent = s;
      if (s <= 0) {
        clearInterval(timer);
        sessionStorage.setItem("highlight_tx", "true");
        window.location.href = "history.html";
      }
    }, 1000);
  }

  document.addEventListener("keypress", e => e.key === "Enter" && buyAirtime());
</script>
</body>
</html>
