<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Abro adeg</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600;800&display=swap');
    body { margin:0; height:100vh; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); font-family: 'Poppins', sans-serif; display:flex; align-items:center; justify-content:center; }
    .login { background: rgba(255,255,255,0.1); backdrop-filter: blur(20px); border-radius: 30px; padding:50px 40px; width:90%; max-width:400px; text-align:center; box-shadow:0 20px 50px rgba(0,0,0,0.3); }
    .logo { font-size:60px; background: linear-gradient(45deg,#ff00aa,#00ffff); -webkit-background-clip:text; -webkit-text-fill-color:transparent; font-weight:800; }
    input, button { width:100%; padding:16px; margin:12px 0; border:none; border-radius:15px; font-size:16px; }
    input { background:rgba(255,255,255,0.2); color:white; }
    input::placeholder { color:#ddd; }
    button { background: linear-gradient(45deg,#ff00aa,#00ffff); color:white; font-weight:bold; cursor:pointer; transition:0.4s; }
    button:hover { transform:scale(1.05); }
  </style>
</head>
<body>
  <div class="login">
    <div class="logo">Abro.com</div>
    <p style="color:#fff; margin:20px 0;">See the colors of life</p>
    <input type="text" placeholder="Phone or email" />
    <input type="password" placeholder="Password" />
    <button onclick="location.href='homee.html'">Enter Vivid</button>
  </div>
</body>
</html>
