<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Send Money + Receipt • NefroPay</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"/>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@500;700&display=swap');
    
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',sans-serif; }
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      transition: all 0.6s;
    }
    .container {
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(25px);
      border-radius: 32px;
      width: 100%;
      max-width: 430px;
      padding: 40px 30px;
      text-align: center;
      box-shadow: 0 30px 80px rgba(0,0,0,0.7);
      border: 2px solid rgba(0,255,255,0.5);
      position: relative;
      overflow: hidden;
    }
    .glow {
      position: absolute;
      width: 300px; height: 300px;
      background: radial-gradient(circle, rgba(0,255,255,0.3), transparent);
      top: -100px; left: -100px;
      animation: rotate 15s infinite linear;
    }
    @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    .icon { font-size: 70px; color: #00ffff; margin-bottom: 20px; animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.15); } }

    h1 { font-size: 36px; background: linear-gradient(90deg, #00ffff, #00ff9d); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 15px 0; }

    input, button {
      width: 100%;
      padding: 20px;
      margin: 15px 0;
      border: none;
      border-radius: 18px;
      font-size: 18px;
    }
    input {
      background: rgba(255,255,255,0.15);
      color: white;
      text-align: center;
    }
    input::placeholder { color: #ccc; }

    .send-btn {
      background: linear-gradient(45deg, #00ffff, #00ff9d);
      color: #000;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 15px 40px rgba(0,255,255,0.5);
    }

    /* RECEIPT STYLE */
    #receipt {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.95);
      display: none; justify-content: center; align-items: center;
      z-index: 9999;
      padding: 20px;
    }
    .receipt-card {
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      border-radius: 28px;
      width: 100%;
      max-width: 400px;
      padding: 40px 30px;
      text-align: center;
      border: 3px solid #00ffff;
      box-shadow: 0 0 60px rgba(0,255,255,0.6);
      animation: pop 0.6s ease-out;
    }
    @keyframes pop {
      0% { transform: scale(0.3); opacity: 0; }
      80% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
    .success-icon {
      font-size: 90px;
      color: #00ff9d;
      margin-bottom: 20px;
      animation: bounce 2s infinite;
    }
    @keyframes bounce {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }
    .receipt-details {
      background: rgba(255,255,255,0.1);
      padding: 20px;
      border-radius: 18px;
      margin: 20px 0;
      font-size: 18px;
      line-height: 2;
    }
    .close-btn {
      background: #ff0066;
      color: white;
      padding: 18px;
      border-radius: 18px;
      margin-top: 20px;
    }


  </style>
</head>
<body>

  
<div class="glow"></div>
<div class="container">
  <div class="icon">
    <i class="fas fa-paper-plane"></i>
  </div>
  <h1>Send Money</h1>
  <p>ገንዘብ ላክ • Instant Transfer</p>

  <input type="tel" id="toPhone" placeholder="Recipient Phone (09xxxxxxxx)" maxlength="10">
  <input type="number" id="amount" placeholder="Amount (ETB)" min="10">

  <button class="send-btn" onclick="sendMoney()">
    <i class="fas fa-paper-plane"></i> Send Money Now
  </button>
</div>



<!-- RECEIPT POPUP -->
<div id="receipt">
  <div class="receipt-card">
    <div class="success-icon">
      <i class="fas fa-check-circle"></i>
    </div>
    <h1>Success!</h1>
    <p>ተልኳል! Money Sent Successfully</p>

    <div class="receipt-details" id="receiptDetails">
      <!-- Filled by JS -->
    </div>

    <button class="close-btn" onclick="closeReceipt()">Done</button>
  </div>
</div>



<script>
  // Load user data
  let user = JSON.parse(localStorage.getItem("nefro_user") || "{}");
  if (!user.balance) {
    user = { phone: "0912345678", balance: 30000, history: [] };
    localStorage.setItem("nefro_user", JSON.stringify(user));
  }

  function sendMoney() {
    const phone = document.getElementById("toPhone").value;
    const amount = parseFloat(document.getElementById("amount").value);

    if (!phone || phone.length !== 10 || !phone.startsWith("09")) {
      alert("Invalid phone number!");
      return;
    }
    if (!amount || amount <= 0 || amount > user.balance) {
      alert("Invalid amount or insufficient balance!");
      return;
    }

    // Process transaction
    user.balance -= amount;
    const tx = {
      to: phone,
      amount: amount,
      date: new Date().toLocaleString("en-ET"),
      ref: "TX" + Date.now().toString().slice(-8)
    };
    user.history.unshift(tx);
    localStorage.setItem("nefro_user", JSON.stringify(user));

    // Show receipt
    document.getElementById("receiptDetails").innerHTML = `
      <strong>Reference:</strong> ${tx.ref}<br>
      <strong>To:</strong> ${phone}<br>
      <strong>Amount:</strong> ${amount.toFixed(2)} ETB<br>
      <strong>Date:</strong> ${tx.date}<br>
      <strong>From:</strong> ${user.phone || "You"}<br>
      <strong>New Balance:</strong> ${user.balance.toFixed(2)} ETB
    `;
    document.getElementById("receipt").style.display = "flex";
  }

  function closeReceipt() {
    document.getElementById("receipt").style.display = "none";
    document.getElementById("toPhone").value = "";
    document.getElementById("amount").value = "";
  }

  // Enter key to send
  document.addEventListener("keypress", e => e.key === "Enter" && sendMoney());
</script>

</body>
</html>
